[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-clinepass-enhanced"
version = "1.3.0"
description = "ClinePass model-provider plugin for Hermes Agent (live plan-catalog discovery + non-streaming envelope fix)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gaurav Saluja" }, { name = "Adolanium" }]
keywords = ["hermes", "hermes-agent", "clinepass", "llm", "provider"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Hermes Agent must already be installed (provides `providers`).
dependencies = []

[project.urls]
Homepage = "https://github.com/thesaluja/hermes-clinepass-enhanced"
Repository = "https://github.com/thesaluja/hermes-clinepass-enhanced"
Issues = "https://github.com/thesaluja/hermes-clinepass-enhanced/issues"
Upstream = "https://github.com/Adolanium/hermes-clinepass"
ClinePass = "https://cline.bot/cline-pass"
Hermes = "https://github.com/NousResearch/hermes-agent"

[project.entry-points."hermes_agent.plugins"]
clinepass = "clinepass:register"

[tool.setuptools.packages.find]
include = ["clinepass*"]

[tool.setuptools.package-data]
clinepass = ["plugin.yaml"]
